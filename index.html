<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gia đình bé Miu đáng iu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffe6f0;
      text-align: center;
      padding: 50px;
      transition: background-image 0.5s ease;
      margin: 0;
    }

    .box {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.2);
      max-width: 500px;
      margin: 80px auto 0 auto;
    }

    img.avatar {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid #ff80ab;
      transition: opacity 0.5s ease;
    }

    .btn-top-left, .btn-cat {
      position: absolute;
      top: 20px;
      background-color: #ff80ab;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      z-index: 100;
    }

    .btn-top-left {
      left: 20px;
    }

    .btn-cat {
      left: 80px;
    }

    .btn-top-left:hover,
    .btn-cat:hover {
      background-color: #ff4d94;
    }
  </style>
</head>
<body>

  <!-- Nút đổi nền -->
  <button class="btn-top-left" onclick="thayAnhNen()">❤️</button>

  <!-- Nút đổi ảnh đại diện -->
  <button class="btn-cat" onclick="doiAnhMiu()">🐱</button>

  <div class="box">
    <img class="avatar" id="avatar" src="2R0A4503.JPG" alt="Ảnh Bé Miu">
    <h1>Gia đình bé Miu đáng iu</h1>
    <p>Chào mừng bạn đến với thế giới dễ thương của Miu!</p>
  </div>

  <!-- Âm thanh meow -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <script>
    // Ảnh nền (1–6.JPG)
    const backgrounds = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG"];
    let nenIndex = 0;

    function thayAnhNen() {
      document.body.style.backgroundImage = `url('${backgrounds[nenIndex]}')`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundRepeat = "no-repeat";
      document.body.style.backgroundPosition = "center";
      nenIndex = (nenIndex + 1) % backgrounds.length;
    }

    // Ảnh đại diện (bắt đầu từ 2R0A4503.JPG)
    const avatars = ["2R0A4503.JPG", "1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG"];
    let avatarIndex = 0;

    function doiAnhMiu() {
      const avatar = document.getElementById('avatar');
      const sound = document.getElementById('meowSound');

      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];

      sound.currentTime = 0;
      sound.play();
    }
  </script>

</body>
</html>
