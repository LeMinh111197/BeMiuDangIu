<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gia đình bé Miu đáng iu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background-image: url('galaxy.jpg'); /* Nền dải ngân hà */
      background-size: cover;
      background-repeat: repeat;
      animation: moveGalaxy 60s linear infinite;
    }

    @keyframes moveGalaxy {
      0% { background-position: 0 0; }
      100% { background-position: -2000px 0; }
    }

    .background-image {
      width: 100%;
      height: 500px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-bottom: 3px solid #ffccff;
    }

    .background-image img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      user-drag: none;
      user-select: none;
      cursor: grab;
    }

    .background-image:active img {
      cursor: grabbing;
    }

    .container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: -100px; /* Đẩy container lên đè lên ảnh nền */
    }

    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: flex-start;
      padding-left: 40px;
    }

    img.avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff80ab;
      cursor: pointer;
      transition: transform 0.3s ease;
      background-color: #fff;
      z-index: 2;
    }

    img.avatar:hover {
      transform: scale(1.05);
    }

    .text-container {
      flex: 2;
      text-align: left;
      padding-left: 40px;
    }

    h1 {
      color: #ffccff;
      font-size: 32px;
      margin: 0;
    }

    p {
      font-size: 20px;
      color: #eeeeee;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>

  <!-- Ảnh nền lớn -->
  <div class="background-image" onclick="doiAnhNen()" id="bgContainer">
    <img id="bgImage" src="1.JPG" alt="Ảnh nền">
  </div>

  <!-- Phần nội dung đè lên ảnh nền -->
  <div class="container">
    <div class="avatar-container">
      <img id="avatar" class="avatar" src="2R0A4503.JPG" alt="Ảnh Miu" onclick="doiAnhMiu()">
    </div>
    <div class="text-container">
      <h1>Gia đình bé Miu đáng iu</h1>
      <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
    </div>
  </div>

  <!-- Âm thanh meo -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <script>
    const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
    let avatarIndex = 0;
    let bgIndex = 0;

    function doiAnhMiu() {
      const avatar = document.getElementById('avatar');
      const sound = document.getElementById('meowSound');

      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];
      sound.currentTime = 0;
      sound.play();
    }

    function doiAnhNen() {
      const bgImage = document.getElementById('bgImage');
      bgIndex = (bgIndex + 1) % avatars.length;
      bgImage.src = avatars[bgIndex];
    }

    // Kéo ảnh nền
    const bgImage = document.getElementById('bgImage');
    const bgContainer = document.getElementById('bgContainer');
    let isDragging = false;
    let startX, currentX = 0;

    bgContainer.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX - currentX;
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      bgImage.style.left = currentX + 'px';
    });

    bgContainer.addEventListener('touchstart', function(e) {
      isDragging = true;
      startX = e.touches[0].clientX - currentX;
    });

    document.addEventListener('touchend', function() {
      isDragging = false;
    });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      bgImage.style.left = currentX + 'px';
    });
  </script>

</body>
</html>
