<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bé Miu đáng iu</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: #fff;
      background-image: url('galaxy.jpg');
      background-size: cover;
      background-repeat: repeat;
      animation: moveGalaxy 60s linear infinite;
    }

    @keyframes moveGalaxy {
      0% { background-position: 0 0; }
      100% { background-position: -2000px 0; }
    }

    .background-image {
      width: 100%;
      height: 500px;
      overflow: hidden;
      position: relative;
      border-bottom: 3px solid #ffccff;
    }

    .background-image img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: auto;
      user-drag: none;
      user-select: none;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .controls {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      gap: 10px;
      opacity: 0.5;
      z-index: 3;
    }

    .controls button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 20px;
      border-radius: 8px;
      padding: 4px 10px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
    }

    .controls button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .container {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      margin-top: 60px;
      z-index: 2;
    }

    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: flex-start;
      padding-left: 40px;
    }

    img.avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff80ab;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.4s;
      background-color: #fff;
    }

    img.avatar:hover {
      transform: scale(1.05);
    }

    .text-container {
      flex: 2;
      text-align: left;
      padding-left: 20px;
    }

    h1 {
      color: #ffccff;
      font-size: 32px;
      margin: 0;
    }

    p {
      font-size: 20px;
      color: #eeeeee;
      margin: 10px 0 0 0;
    }
  </style>
</head>
<body>

  <!-- Ảnh nền -->
  <div class="background-image" id="bgContainer">
    <img id="bgImage" src="4.JPG" alt="Ảnh nền">
    <div class="controls">
      <button onclick="zoomIn()">+</button>
      <button onclick="zoomOut()">−</button>
      <button onclick="resetImage()">⟲</button>
    </div>
  </div>

  <!-- Nội dung -->
  <div class="container">
    <div class="avatar-container">
      <img id="avatar" class="avatar" src="9.JPG" alt="Ảnh Miu" onclick="doiAnhMiu()">
    </div>
    <div class="text-container">
      <h1>Bé Miu đáng iu</h1>
      <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
    </div>
  </div>

  <!-- Âm thanh -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <script>
    const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
    const avatar = document.getElementById('avatar');
    const sound = document.getElementById('meowSound');
    const bgImage = document.getElementById('bgImage');

    let avatarIndex = 0;
    let currentX = 0;
    let scale = 1;
    let isDragging = false;
    let startX;

    const savedAvatar = localStorage.getItem('selectedAvatar');
    if (savedAvatar && avatars.includes(savedAvatar)) {
      avatar.src = savedAvatar;
      avatarIndex = avatars.indexOf(savedAvatar);
    }

    function doiAnhMiu() {
      avatar.style.opacity = 0;
      setTimeout(() => {
        avatarIndex = (avatarIndex + 1) % avatars.length;
        const newAvatar = avatars[avatarIndex];
        avatar.src = newAvatar;
        localStorage.setItem('selectedAvatar', newAvatar);
        avatar.style.opacity = 1;
        sound.currentTime = 0;
        sound.play();
      }, 400);
    }

    const bgContainer = document.getElementById('bgContainer');

    bgContainer.addEventListener('mousedown', e => {
      isDragging = true;
      startX = e.clientX - currentX;
    });

    document.addEventListener('mouseup', () => isDragging = false);

    document.addEventListener('mousemove', e => {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      bgImage.style.left = currentX + 'px';
      saveBackgroundState();
    });

    function zoomIn() {
      scale += 0.1;
      updateZoom();
    }

    function zoomOut() {
      scale = Math.max(0.5, scale - 0.1);
      updateZoom();
    }

    function resetImage() {
      scale = 1;
      currentX = 0;
      bgImage.style.left = '0px';
      updateZoom();
      saveBackgroundState();
    }

    function updateZoom() {
      bgImage.style.transform = `scale(${scale})`;
      saveBackgroundState();
    }

    function saveBackgroundState() {
      const state = {
        left: bgImage.style.left,
        scale: scale,
        src: bgImage.src
      };
      localStorage.setItem('bgState', JSON.stringify(state));
    }

    window.addEventListener('load', () => {
      const saved = JSON.parse(localStorage.getItem('bgState'));
      if (saved) {
        currentX = parseInt(saved.left) || 0;
        scale = saved.scale || 1;
        bgImage.src = saved.src || '4.JPG';
        bgImage.style.left = currentX + 'px';
        updateZoom();
      }
    });

    bgContainer.addEventListener('touchstart', e => {
      isDragging = true;
      startX = e.touches[0].clientX - currentX;
    });

    document.addEventListener('touchend', () => isDragging = false);

    document.addEventListener('touchmove', e => {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      bgImage.style.left = currentX + 'px';
      saveBackgroundState();
    });
  </script>

</body>
</html>
