<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bé Miu đáng iu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #000 url('galaxy.jpg') repeat;
      background-size: cover;
      animation: moveGalaxy 60s linear infinite;
    }

    @keyframes moveGalaxy {
      0% { background-position: 0 0; }
      100% { background-position: -2000px 0; }
    }

    .background-image {
      width: 100%;
      height: 500px;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid #ffccff;
    }

    .background-image img {
      width: auto;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -100px;
      flex-wrap: wrap;
    }

    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: flex-start;
      padding-left: 40px;
    }

    img.avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff80ab;
      background: #fff;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.4s;
    }

    img.avatar:hover {
      transform: scale(1.05);
    }

    .text-container {
      flex: 2;
      text-align: left;
      padding-left: 40px;
      margin-top: 80px;
    }

    h1 {
      color: #ffccff;
      font-size: 32px;
      margin: 0;
    }

    p {
      font-size: 20px;
      margin: 10px 0 0 0;
    }

    #passwordScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #passwordScreen input {
      padding: 10px;
      font-size: 18px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    #passwordScreen button {
      margin-top: 10px;
      padding: 8px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #logoutButton {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 9;
      backdrop-filter: blur(5px);
    }

    #logoutButton:hover {
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<!-- Giao diện nhập mật khẩu -->
<div id="passwordScreen">
  <p>Để tiếp tục xem ảnh Bé Miu, vui lòng nhập mật khẩu vào ô sau:</p>
  <input type="password" id="passwordInput" placeholder="Nhập mật khẩu...">
  <button onclick="checkPassword()">Xác nhận</button>
</div>

<!-- Nút đăng xuất -->
<button id="logoutButton" onclick="logout()" style="display: none;">Đăng xuất</button>

<!-- Phần nội dung chính -->
<div class="background-image" id="bgContainer">
  <img id="bgImage" src="4.JPG" alt="Ảnh nền">
</div>

<div class="container">
  <div class="avatar-container">
    <img id="avatar" class="avatar" src="9.JPG" alt="Ảnh Miu" onclick="doiAnhMiu()">
  </div>
  <div class="text-container">
    <h1>Bé Miu đáng iu</h1>
    <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
  </div>
</div>

<!-- Âm thanh mèo -->
<audio id="meowSound" src="meow.mp3" preload="auto"></audio>

<script>
  const CORRECT_PASSWORD = "04122023";
  const avatar = document.getElementById('avatar');
  const sound = document.getElementById('meowSound');

  const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
  let avatarIndex = 0;

  function doiAnhMiu() {
    avatar.style.opacity = 0;
    setTimeout(() => {
      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];
      localStorage.setItem("selectedAvatar", avatars[avatarIndex]);
      avatar.style.opacity = 1;
      sound.currentTime = 0;
      sound.play();
    }, 400);
  }

  // Kiểm tra mật khẩu khi tải trang
  window.onload = () => {
    const saved = localStorage.getItem('accessGranted');
    const savedAvatar = localStorage.getItem('selectedAvatar');
    if (saved === "true") {
      document.getElementById('passwordScreen').style.display = "none";
      document.getElementById('logoutButton').style.display = "block";
    }

    if (savedAvatar && avatars.includes(savedAvatar)) {
      avatar.src = savedAvatar;
      avatarIndex = avatars.indexOf(savedAvatar);
    }
  };

  function checkPassword() {
    const input = document.getElementById('passwordInput').value.trim();
    if (input === CORRECT_PASSWORD) {
      document.getElementById('passwordScreen').style.display = "none";
      document.getElementById('logoutButton').style.display = "block";
      localStorage.setItem('accessGranted', "true");
    } else {
      alert("Sai mật khẩu!");
    }
  }

  function logout() {
    localStorage.removeItem('accessGranted');
    location.reload();
  }
</script>

</body>
</html>
