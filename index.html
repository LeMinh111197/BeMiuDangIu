<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gia đình bé Miu đáng iu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background-image: url('galaxy.jpg'); /* nền galaxy */
      background-size: cover;
      background-repeat: repeat;
      animation: moveGalaxy 60s linear infinite;
    }

    @keyframes moveGalaxy {
      0% { background-position: 0 0; }
      100% { background-position: -2000px 0; }
    }

    .background-image {
      width: 100%;
      height: 350px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-bottom: 3px solid #ffccff;
    }

    .background-image img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      min-width: 100%; /* ✅ đảm bảo ảnh luôn phủ hết chiều ngang */
      user-drag: none;
      user-select: none;
      cursor: grab;
    }

    .background-image:active img {
      cursor: grabbing;
    }

    .avatar-container {
      position: absolute;
      top: 220px;
      left: 40px;
      z-index: 2;
    }

    img.avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff80ab;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    img.avatar:hover {
      transform: scale(1.05);
    }

    .container {
      position: relative;
      padding-top: 180px;
      text-align: center;
    }

    .text-container {
      margin-top: 80px;
    }

    h1 {
      color: #ffccff;
      font-size: 32px;
    }

    p {
      font-size: 20px;
      color: #eeeeee;
    }
  </style>
</head>
<body>

  <!-- Ảnh nền có thể đổi và kéo -->
  <div class="background-image" onclick="doiAnhNen()" id="bgContainer">
    <img id="bgImage" src="1.JPG" alt="Ảnh nền">
  </div>

  <!-- Ảnh đại diện nằm đè lên nền -->
  <div class="avatar-container">
    <img id="avatar" class="avatar" src="1.JPG" alt="Ảnh Miu" onclick="doiAnhMiu()">
  </div>

  <!-- Phần chữ giới thiệu -->
  <div class="container">
    <div class="text-container">
      <h1>Gia đình bé Miu đáng iu</h1>
      <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
    </div>
  </div>

  <!-- Âm thanh meow -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <!-- JavaScript -->
  <script>
    const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
    let avatarIndex = 0;

    function doiAnhMiu() {
      const avatar = document.getElementById('avatar');
      const sound = document.getElementById('meowSound');

      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];
      sound.currentTime = 0;
      sound.play();
    }

    let bgIndex = 0;

    function doiAnhNen() {
      const bgImage = document.getElementById('bgImage');
      bgIndex = (bgIndex + 1) % avatars.length;
      bgImage.src = avatars[bgIndex];
    }

    // Kéo ảnh nền trái/phải
    const bgImage = document.getElementById('bgImage');
    const bgContainer = document.getElementById('bgContainer');
    let isDragging = false;
    let startX, currentX = 0;

    bgContainer.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX - currentX;
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      bgImage.style.left = currentX + 'px';
    });

    bgContainer.addEventListener('touchstart', function(e) {
      isDragging = true;
      startX = e.touches[0].clientX - currentX;
    });

    document.addEventListener('touchend', function() {
      isDragging = false;
    });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      bgImage.style.left = currentX + 'px';
    });
  </script>

</body>
</html>
