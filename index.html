<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gia đình bé Miu đáng iu</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      color: #fff;
    }

    .cover {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      background-image: url('galaxy.jpg');
      background-size: cover;
      background-position: center;
      animation: moveGalaxy 60s linear infinite;
    }

    @keyframes moveGalaxy {
      0% { background-position: 0 0; }
      100% { background-position: -2000px 0; }
    }

    .avatar {
      position: absolute;
      bottom: -60px;
      left: 40px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid white;
      object-fit: cover;
      cursor: pointer;
      z-index: 2;
    }

    .content {
      padding: 80px 20px 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      color: #d63384;
    }

    p {
      color: #333;
      font-size: 18px;
    }

    .background-image {
      width: 100%;
      height: 240px;
      margin-top: 30px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-radius: 10px;
      border: 3px solid #ffccff;
    }

    .background-image img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      user-drag: none;
      user-select: none;
      cursor: grab;
    }

    .background-image:active img {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <!-- Ảnh bìa -->
  <div class="cover" onclick="doiAnhNen()" id="coverContainer">
    <img id="avatar" class="avatar" src="1.JPG" alt="Avatar" onclick="doiAnhMiu(event)">
  </div>

  <!-- Nội dung chính -->
  <div class="content">
    <h1>Gia đình bé Miu đáng iu</h1>
    <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
  </div>

  <!-- Ảnh nền phía dưới để kéo (giữ lại nếu muốn) -->
  <div class="background-image" onclick="doiAnhNen()" id="bgContainer">
    <img id="bgImage" src="1.JPG" alt="Ảnh nền">
  </div>

  <!-- Âm thanh -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <script>
    const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
    let avatarIndex = 0;

    function doiAnhMiu(event) {
      event.stopPropagation(); // Không cho ảnh bìa click chung
      const avatar = document.getElementById('avatar');
      const sound = document.getElementById('meowSound');

      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];
      sound.currentTime = 0;
      sound.play();
    }

    let bgIndex = 0;
    function doiAnhNen() {
      const bgImage = document.getElementById('bgImage');
      bgIndex = (bgIndex + 1) % avatars.length;
      bgImage.src = avatars[bgIndex];
    }

    const bgImage = document.getElementById('bgImage');
    const bgContainer = document.getElementById('bgContainer');
    let isDragging = false;
    let startX, currentX = 0;

    bgContainer.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX - currentX;
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      bgImage.style.left = currentX + 'px';
    });

    bgContainer.addEventListener('touchstart', function(e) {
      isDragging = true;
      startX = e.touches[0].clientX - currentX;
    });

    document.addEventListener('touchend', function() {
      isDragging = false;
    });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      bgImage.style.left = currentX + 'px';
    });
  </script>

</body>
</html>
