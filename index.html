<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gia đình bé Miu đáng iu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      margin: 0;
      padding: 40px;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .avatar-container {
      flex: 1;
      display: flex;
      justify-content: flex-start;
    }

    img.avatar {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff80ab;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    img.avatar:hover {
      transform: scale(1.05);
    }

    .text-container {
      flex: 2;
      text-align: left;
      padding-left: 40px;
    }

    h1 {
      color: #d63384;
      font-size: 32px;
    }

    p {
      font-size: 20px;
      color: #333;
    }

    /* Ảnh nền bên dưới */
    .background-image {
      width: 100%;
      height: 240px;
      margin-top: 40px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      border-radius: 10px;
    }

    .background-image img {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      user-drag: none;
      user-select: none;
      cursor: grab;
    }

    .background-image:active img {
      cursor: grabbing;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Ảnh đại diện bên trái -->
    <div class="avatar-container">
      <img id="avatar" class="avatar" src="1.JPG" alt="Ảnh Miu" onclick="doiAnhMiu()">
    </div>

    <!-- Nội dung bên phải -->
    <div class="text-container">
      <h1>Gia đình bé Miu đáng iu</h1>
      <p>Chào mừng bạn đến với thế giới dễ thương của bé Miu!</p>
    </div>
  </div>

  <!-- Ảnh nền phía dưới -->
  <div class="background-image" onclick="doiAnhNen()" id="bgContainer">
    <img id="bgImage" src="1.JPG" alt="Ảnh nền">
  </div>

  <!-- Âm thanh meow -->
  <audio id="meowSound" src="meow.mp3" preload="auto"></audio>

  <script>
    const avatars = ["1.JPG", "2.JPG", "3.JPG", "4.JPG", "5.JPG", "6.JPG", "7.JPG", "8.JPG", "9.JPG"];
    let avatarIndex = 0;

    function doiAnhMiu() {
      const avatar = document.getElementById('avatar');
      const sound = document.getElementById('meowSound');

      avatarIndex = (avatarIndex + 1) % avatars.length;
      avatar.src = avatars[avatarIndex];
      sound.currentTime = 0;
      sound.play();
    }

    let bgIndex = 0;

    function doiAnhNen() {
      const bgImage = document.getElementById('bgImage');
      bgIndex = (bgIndex + 1) % avatars.length;
      bgImage.src = avatars[bgIndex];
    }

    // Kéo ảnh nền trong khung
    const bgImage = document.getElementById('bgImage');
    const bgContainer = document.getElementById('bgContainer');
    let isDragging = false;
    let startX, currentX = 0;

    bgContainer.addEventListener('mousedown', function(e) {
      isDragging = true;
      startX = e.clientX - currentX;
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      currentX = e.clientX - startX;
      bgImage.style.left = currentX + 'px';
    });

    // Hỗ trợ cả trên điện thoại
    bgContainer.addEventListener('touchstart', function(e) {
      isDragging = true;
      startX = e.touches[0].clientX - currentX;
    });

    document.addEventListener('touchend', function() {
      isDragging = false;
    });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      currentX = e.touches[0].clientX - startX;
      bgImage.style.left = currentX + 'px';
    });
  </script>

</body>
</html>
